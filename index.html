<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFF4F2">
<title>Rotina a Dois</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%232D5DA6'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%23A23C6C' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita, como o caderno da casa; cabeçalho fixo com abas e o filtro dos três pilares (Marcelo, Carla, Nós dois), cada um com sua cor. */
:root{
  --bg:#EFF4F2; --surface:#FFFFFF; --sunk:#E3ECE8; --line:#D0DCD7;
  --ink:#13302A; --muted:#5A6F69; --accent:#1B6B5F; --accent-ink:#FFFFFF; --accent-soft:#D3E8E2;
  --good:#2C7A47; --bad:#B0432C;
  --pm:#2D5DA6; --pm-soft:#DDE7F6; --pc:#A23C6C; --pc-soft:#F5DEE9; --pd:#1B6B5F; --pd-soft:#D3E8E2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#15201D; --sunk:#1B2926; --line:#293935;
  --ink:#E2EDE9; --muted:#91A69F; --accent:#5ABFAB; --accent-ink:#0B1D19; --accent-soft:#1C3832;
  --good:#6BC388; --bad:#E5876F;
  --pm:#86AEEB; --pm-soft:#1D2A40; --pc:#EB93BC; --pc-soft:#3A2131; --pd:#5ABFAB; --pd-soft:#1C3832; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#15201D; --sunk:#1B2926; --line:#293935;
  --ink:#E2EDE9; --muted:#91A69F; --accent:#5ABFAB; --accent-ink:#0B1D19; --accent-soft:#1C3832;
  --good:#6BC388; --bad:#E5876F;
  --pm:#86AEEB; --pm-soft:#1D2A40; --pc:#EB93BC; --pc-soft:#3A2131; --pd:#5ABFAB; --pd-soft:#1C3832; color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pilares */
.p-marcelo{--p:var(--pm);--ps:var(--pm-soft)}
.p-carla{--p:var(--pc);--ps:var(--pc-soft)}
.p-casal{--p:var(--pd);--ps:var(--pd-soft)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.youare{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.tabs button{border:0;background:transparent;padding:8px 4px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.filter{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter .label{flex:none;margin-right:2px}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.filter button i,.pick button i,.legend i{width:9px;height:9px;border-radius:50%;background:var(--p,var(--muted));flex:none}
.filter button[aria-pressed="true"]{background:var(--ps,var(--ink));border-color:var(--p,var(--ink));color:var(--p,var(--bg))}
.filter button.all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

main{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.block h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;text-wrap:balance}
.block h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{font-family:var(--display);font-size:20px;margin:0;font-weight:700;text-align:center;flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:36px;height:36px;padding:0 12px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{border:0;background:transparent;border-radius:10px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.week button b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.week button .wd{display:flex;gap:2px;height:5px}
.week button .wd i{width:5px;height:5px;border-radius:50%;background:var(--p)}
.week button[aria-pressed="true"]{background:var(--sunk)}
.week button[aria-pressed="true"] b{color:var(--accent)}
.week button.today b{text-decoration:underline;text-underline-offset:3px}

.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%;background:var(--p,var(--accent));transition:width .3s}
.bar.over span{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}

form.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form.add > *{min-width:0}
input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px}
textarea{width:100%;resize:vertical;min-height:72px}
.grow{flex:1 1 180px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:600;min-height:40px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:34px}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink)}
.pick button[aria-checked="true"]{background:var(--ps);color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.fieldrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:10px;padding:9px 0 9px 10px;border-top:1px solid var(--line);min-width:0;position:relative}
ul.list li::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--p,transparent)}
ul.list li:first-child{border-top:0}
.grp + .grp{margin-top:4px}
.grp > .label{padding-bottom:2px;display:block}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.done .txt{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--p,var(--accent));border-color:var(--p,var(--accent))}
.chk[aria-pressed="true"]::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:translateY(-1px) rotate(-45deg)}
.chip{flex:none;display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--ps);color:var(--p);white-space:nowrap}
.del{flex:none;border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--bad)}
.del.armed{color:var(--bad);font-weight:700;background:var(--sunk)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:2px 0;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.dots{display:flex;gap:3px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.on{background:var(--p);border-color:var(--p)}
.streak{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--good)} .neg{color:var(--bad)}
.amt{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.date{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;width:40px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.catrow .bar{grid-column:1 / -1;height:6px}
.limitline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.people3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{border-radius:10px;background:var(--ps);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .label{color:var(--p)}
.pcard b{font-variant-numeric:tabular-nums;font-size:16px;overflow-wrap:anywhere}
.pcard small{color:var(--muted);font-variant-numeric:tabular-nums}

.note{border-top:1px solid var(--line);padding:10px 0 0 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.note::before{content:"";position:absolute;left:0;top:12px;bottom:2px;width:3px;border-radius:3px;background:var(--p)}
.note:first-child{border-top:0;padding-top:0}
.note:first-child::before{top:2px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.note.pinned p{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em}
.login form{display:flex;flex-direction:column;gap:10px}
.login input{width:100%}
.login .legend3{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.login .legend3 span{display:inline-flex;align-items:center;gap:6px}
.login .legend3 i{width:9px;height:9px;border-radius:50%;background:var(--p)}
.login .err{color:var(--bad);font-size:14px;margin:0}
input[type=email],input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px}
@media (max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:1 / -1}
  .people3{grid-template-columns:1fr}
  .tabs button{font-size:13px}
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <h1>Rotina a Dois</h1>
  <p class="muted" style="margin:0">Rotina, hábitos, finanças, compras e notas da casa, sempre separados entre:</p>
  <div class="legend3"><span class="p-marcelo"><i></i>Marcelo</span><span class="p-carla"><i></i>Carla</span><span class="p-casal"><i></i>Nós dois</span></div>
  <form id="login-form">
    <input type="email" id="login-email" placeholder="Seu e-mail" autocomplete="username" required aria-label="E-mail">
    <input type="password" id="login-pass" placeholder="Senha" autocomplete="current-password" required aria-label="Senha">
    <button class="btn" type="submit" id="login-btn">Entrar</button>
    <p class="err" id="login-err" hidden></p>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand"><h1>Rotina a Dois</h1><div class="youare"><span id="youare"></span><button class="linkbtn" type="button" id="logout">Sair</button></div></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="hoje" aria-selected="true">Hoje</button>
      <button role="tab" data-tab="financas" aria-selected="false">Finanças</button>
      <button role="tab" data-tab="compras" aria-selected="false">Compras</button>
      <button role="tab" data-tab="notas" aria-selected="false">Notas</button>
    </nav>
    <div class="filter" id="filter" role="group" aria-label="Mostrar itens de"></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, updateDoc, setDoc, deleteDoc,
  onSnapshot, query, orderBy, limit, FieldPath } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { FIREBASE_CONFIG, PESSOAS } from './config.js';

/* ---------- utilidades ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s, n) => { const d = parse(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); };
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return iso(d); };
const ym = s => s.slice(0, 7);
const brl = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = s => parse(s).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = s => { const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fmtMonth = s => cap(parse(s + '-01').toLocaleDateString('pt-BR', {month:'long', year:'numeric'}));
const WD = ['seg','ter','qua','qui','sex','sáb','dom'];
const PERIODS = [['manha','Manhã'],['tarde','Tarde'],['noite','Noite'],['livre','Qualquer hora']];
const CAT_OUT = ['Mercado','Contas fixas','Casa','Transporte','Comer fora','Lazer','Saúde','Compras pessoais','Outros'];
const CAT_IN = ['Salário','Renda extra','Outros'];
const toNum = v => { const n = parseFloat(String(v).replace(/\./g,'').replace(',', '.')); return isFinite(n) ? n : NaN; };

/* ---------- os três pilares ---------- */
const PILLARS = [['marcelo','Marcelo'],['carla','Carla'],['casal','Nós dois']];
const PNAME = Object.fromEntries(PILLARS);
const pOf = x => PNAME[x && x.who] ? x.who : 'casal';
let viewer = 'marcelo';          // quem está usando este aparelho (dono = Marcelo, convidada = Carla)
let filterP = 'todos';
try { const f = localStorage.getItem('rad-filter'); if (f === 'todos' || PNAME[f]) filterP = f; } catch {}
const pass = x => filterP === 'todos' || pOf(x) === filterP;
function chip(p){ return h('span', {class: 'chip p-' + p, text: PNAME[p]}); }
function pillarPicker(label){
  let val = null, touched = false;
  const box = h('div', {class: 'seg pick', role: 'radiogroup', 'aria-label': label});
  const draw = () => box.replaceChildren(...PILLARS.map(([v, l]) => h('button', {type: 'button', role: 'radio', class: 'p-' + v, 'aria-checked': String(v === box.get()),
    onclick: () => { val = v; touched = true; draw(); }}, h('i'), l)));
  box.get = () => val || (filterP !== 'todos' ? filterP : viewer);
  box.sync = () => { if (!touched) val = null; draw(); };
  box.reset = () => { touched = false; val = null; draw(); };
  draw();
  return box;
}
function renderFilter(){
  const box = document.getElementById('filter');
  box.replaceChildren(h('span', {class: 'label'}, 'Mostrar'),
    h('button', {type: 'button', class: 'all', 'aria-pressed': String(filterP === 'todos'), onclick: () => setFilter('todos')}, 'Todos'),
    ...PILLARS.map(([v, l]) => h('button', {type: 'button', class: 'p-' + v, 'aria-pressed': String(filterP === v), onclick: () => setFilter(v)}, h('i'), l)));
  document.getElementById('youare').replaceChildren(mode === 'live' ? h('span', {}, 'Você está como ', h('span', {class: 'chip p-' + viewer, text: PNAME[viewer]})) : '');
}
function setFilter(v){ filterP = v; armed = null; try { localStorage.setItem('rad-filter', v); } catch {} refresh(); }

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* exclusão em dois toques */
let armed = null, armedT;
function arm(key){ armed = key; clearTimeout(armedT); armedT = setTimeout(() => { armed = null; refresh(); }, 3000); refresh(); }
function delBtn(key, onConfirm){
  const on = armed === key;
  return h('button', {class: 'del' + (on ? ' armed' : ''), type: 'button', 'aria-label': on ? 'Confirmar exclusão' : 'Excluir',
    onclick: () => { if (armed === key){ armed = null; onConfirm(); } else arm(key); }}, on ? 'Confirmar?' : '✕');
}
const emptyMsg = (all, some) => h('p', {class: 'empty'}, filterP === 'todos' ? all : `${some} de ${PNAME[filterP]}.`);

/* ---------- dados (Firebase Firestore) ---------- */
const COLS = ['tasks','habits','transactions','shopping','notes','settings'];
const data = {}; COLS.forEach(c => data[c] = []);
let mode = 'loading', readOnly = false;

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const fs = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});

function onWriteError(e){
  console.error(e);
  if (e && e.code === 'permission-denied') toast('Sem permissão para salvar. Confira se seu e-mail está liberado nas regras do Firestore.');
  else if (e && e.code === 'resource-exhausted') toast('O limite gratuito do Firebase foi atingido hoje. Tente amanhã.');
  else toast('Não consegui salvar agora. Tente de novo em instantes.');
}
// As gravações aparecem na tela na hora (cache local) e vão para o servidor em seguida, mesmo sem internet no momento.
const fire = p => { p.catch(onWriteError); return Promise.resolve(); };
function fieldPairs(obj, pre = [], out = []){
  for (const [k, v] of Object.entries(obj)){
    const path = [...pre, k];
    if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length) fieldPairs(v, path, out);
    else out.push(new FieldPath(...path), v);
  }
  return out;
}
const store = {
  add: (col, obj) => fire(addDoc(collection(fs, col), obj)),
  update: (col, id, patch) => fire(updateDoc(doc(fs, col, id), ...fieldPairs(patch))),

            h('span', {class: 'dots', 'aria-hidden': 'true'}, ws7.map(d => h('i', {class: x.days && x.days[d] ? 'on' : null}))),

function streakText(x){
  const days = x.days || {}; let d = today(); if (!days[d]) d = addDays(d, -1);
  let n = 0; while (days[d]){ n++; d = addDays(d, -1); }
  return n ? `${n} ${n === 1 ? 'dia seguido' : 'dias seguidos'}` : 'sem sequência ainda';

  update(){
    this.who.sync();
    const items = data.shopping.filter(pass).sort((a, b) => (a.done - b.done) || (a.createdAt || 0) - (b.createdAt || 0));
    const pend = items.filter(x => !x.done), got = items.filter(x => x.done);
    this.title.replaceChildren('Lista de compras', h('small', {}, pend.length ? `${pend.length} para comprar` : ''));
    const row = x => h('li', {class: `p-${pOf(x)}${x.done ? ' done' : ''}`},
      h('button', {class: 'chk', type: 'button', 'aria-pressed': String(!!x.done), 'aria-label': x.done ? 'Voltar para a lista' : 'Marcar como comprado', onclick: () => store.update('shopping', x.id, {done: !x.done})}),
      h('span', {class: 'txt', text: x.item}), x.qty ? h('span', {class: 'muted num', text: x.qty}) : null, chip(pOf(x)),
      delBtn('s' + x.id, () => store.remove('shopping', x.id)));
    if (!items.length){ this.box.replaceChildren(emptyMsg('A lista está vazia. Quem lembrar de algo adiciona aqui, dizendo se é do Marcelo, da Carla ou da casa.', 'Nenhum item')); return; }
    const clearKey = 'clear-shop';
    this.box.replaceChildren(
      pend.length ? h('ul', {class: 'list'}, pend.map(row)) : h('p', {class: 'empty'}, 'Tudo comprado.'),
      got.length ? h('div', {class: 'grp', style: 'margin-top:8px'}, h('div', {class: 'limitline'}, h('span', {class: 'label'}, `No carrinho (${got.length})`),
        h('button', {class: 'linkbtn', type: 'button', style: armed === clearKey ? 'color:var(--bad)' : null, onclick: async () => {
          if (armed !== clearKey){ arm(clearKey); return; }
          armed = null; for (const x of got) await store.remove('shopping', x.id); }}, armed === clearKey ? 'Confirmar limpeza?' : 'Limpar comprados')),
        h('ul', {class: 'list'}, got.map(row))) : null);
  }
};

/* ---------- aba: Notas ---------- */
const Notas = {
  mount(root){
    this.text = h('textarea', {id: 'note-text', placeholder: 'Ideias, lembretes, a senha do Wi-Fi da casa, o que quiser guardar...', 'aria-label': 'Nova nota', maxlength: 4000});
    this.who = pillarPicker('De quem é a nota');
    const form = h('form', {style: 'display:flex;flex-direction:column;gap:8px', onsubmit: e => { e.preventDefault(); const text = this.text.value.trim(); if (!text) return;
      store.add('notes', {text, who: this.who.get(), pinned: false, ...stamp()}); this.text.value = ''; }},
      this.text, h('div', {class: 'fieldrow'}, h('span', {class: 'label'}, 'De'), this.who, h('button', {class: 'btn', type: 'submit', style: 'margin-left:auto'}, 'Salvar nota')));
    this.box = h('div', {style: 'display:flex;flex-direction:column;gap:10px'});
    root.append(h('section', {class: 'block'}, h('h2', {}, 'Notas'), form), h('section', {class: 'block'}, this.box));
  },
  update(){
    this.who.sync();
    const notes = data.notes.filter(pass).sort((a, b) => (b.pinned - a.pinned) || (b.createdAt || 0) - (a.createdAt || 0));
    if (!notes.length){ this.box.replaceChildren(emptyMsg('Nenhuma nota ainda. O que um escrever, o outro vê na hora.', 'Nenhuma nota')); return; }
    this.box.replaceChildren(...notes.map(x => h('div', {class: `note p-${pOf(x)}${x.pinned ? ' pinned' : ''}`},
      h('p', {text: x.text}),
      h('div', {class: 'meta'}, chip(pOf(x)), h('span', {text: x.createdAt ? new Date(x.createdAt).toLocaleDateString('pt-BR', {day: 'numeric', month: 'short'}) : ''}),
        h('button', {class: 'linkbtn', type: 'button', onclick: () => store.update('notes', x.id, {pinned: !x.pinned})}, x.pinned ? 'Desafixar' : 'Fixar no topo'),
        h('button', {class: 'linkbtn', type: 'button', onclick: async () => { await store.add('tasks', {title: x.text.split('\n')[0].slice(0, 140), date: today(), period: 'livre', who: pOf(x), done: false, ...stamp()}); toast('Virou tarefa de hoje.'); }}, 'Virar tarefa'),
        delBtn('n' + x.id, () => store.remove('notes', x.id))))));
  }
};

/* ---------- navegação ---------- */
const VIEWS = {hoje: Hoje, financas: Financas, compras: Compras, notas: Notas};
let tab = 'hoje';
try { const s = localStorage.getItem('rad-tab'); if (s && VIEWS[s]) tab = s; } catch {}
const hash = location.hash.slice(1); if (VIEWS[hash]) tab = hash;
function mountTab(){
  const main = document.getElementById('main'); main.replaceChildren();
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  VIEWS[tab].mount(main); refresh();
}
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; armed = null; try { localStorage.setItem('rad-tab', tab); } catch {} mountTab(); window.scrollTo(0, 0); });

let raf = 0, mounted = false;
function refresh(){ if (raf || !mounted) return; raf = requestAnimationFrame(() => { raf = 0; VIEWS[tab].update(); renderFilter(); renderBanner(); }); }
function renderBanner(){
  const b = document.getElementById('banner');
  const msg = !navigator.onLine ? 'Sem internet agora. O que vocês anotarem fica salvo no aparelho e sobe sozinho quando a conexão voltar.' : '';
  b.replaceChildren(msg ? h('div', {class: 'banner', style: 'margin-bottom:12px'}, msg) : '');
}
addEventListener('online', refresh); addEventListener('offline', refresh);

/* ---------- login e início ---------- */
const $login = document.getElementById('login'), $app = document.getElementById('app'), $err = document.getElementById('login-err');
const emailMap = Object.fromEntries(Object.entries(PESSOAS).map(([e, p]) => [e.trim().toLowerCase(), p]));
function showError(msg){ $err.textContent = msg; $err.hidden = !msg; }
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('login-btn'); btn.disabled = true; btn.textContent = 'Entrando...'; showError('');
  try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value.trim(), document.getElementById('login-pass').value); }
  catch (err){
    const c = err && err.code;
    showError(c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' ? 'E-mail ou senha incorretos.'
      : c === 'auth/too-many-requests' ? 'Muitas tentativas. Espere alguns minutos e tente de novo.'
      : c === 'auth/network-request-failed' ? 'Sem conexão com a internet.' : 'Não consegui entrar. Tente de novo.');
  }
  btn.disabled = false; btn.textContent = 'Entrar';
});
document.getElementById('logout').addEventListener('click', () => signOut(auth));

let unsubs = [];
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  COLS.forEach(c => data[c] = []);
  if (!u){ mounted = false; mode = 'loading'; $app.hidden = true; $login.hidden = false; return; }
  const p = emailMap[(u.email || '').toLowerCase()];
  if (!p){ showError('Este e-mail não está liberado no Rotina a Dois.'); signOut(auth); return; }
  viewer = p; mode = 'live';
  $login.hidden = true; $app.hidden = false; mounted = true;
  const sub = (col, ...cons) => unsubs.push(onSnapshot(query(collection(fs, col), ...cons),
    s => { data[col] = s.docs.map(d => ({id: d.id, ...d.data()})); refresh(); },
    e => { console.error(e); toast(e.code === 'permission-denied' ? 'Sem permissão para ler os dados. Confira as regras do Firestore.' : 'Não consegui carregar os dados.'); }));
  sub('tasks', orderBy('date', 'desc'), limit(1000));
  sub('habits', limit(200));
  sub('transactions', orderBy('date', 'desc'), limit(1000));
  sub('shopping', limit(500));
  sub('notes', orderBy('createdAt', 'desc'), limit(300));
  sub('settings', limit(10));
  mountTab();
});
</script>
</body>
</html>
