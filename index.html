<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3F6">
<title>Rotina a Dois</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23C9973A'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%23D63F78' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: celular primeiro. Saudação no topo, filtro dos três pilares, cartões arredondados e menu fixo embaixo.
   Rosa e dourado: Marcelo = dourado, Carla = rosa, Nós dois = vinho (a mistura dos dois). */
:root{
  --bg:#FFF3F6; --surface:#FFFFFF; --sunk:#FCE8EF; --line:#F3D4DF;
  --ink:#4A1D33; --muted:#8E6577; --accent:#D63F78; --accent-2:#B92D63; --accent-ink:#FFFFFF; --accent-soft:#FCE1EB;
  --gold:#B8862C; --gold-2:#E7C373; --gold-soft:#F8EBD2;
  --good:#2E8B62; --bad:#C8324A;
  --pm:#B07A1E; --pm-soft:#F8ECD3; --pc:#D63F78; --pc-soft:#FCE1EB; --pd:#8A3D78; --pd-soft:#F3E2EF;
  --shadow:0 10px 24px -14px rgb(170 50 100 / .45), 0 1px 3px rgb(170 50 100 / .08);
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B0F16; --surface:#26161F; --sunk:#311D29; --line:#432A39;
  --ink:#F8E7EE; --muted:#C29CAD; --accent:#F06A9C; --accent-2:#E0477F; --accent-ink:#2A0E1B; --accent-soft:#40192B;
  --gold:#E5BA5E; --gold-2:#F3D78E; --gold-soft:#3A2B14;
  --good:#6FCB98; --bad:#F07A8C;
  --pm:#E5BA5E; --pm-soft:#3A2B14; --pc:#F27CA7; --pc-soft:#45192D; --pd:#D195C8; --pd-soft:#382036;
  --shadow:0 10px 24px -14px rgb(0 0 0 / .7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B0F16; --surface:#26161F; --sunk:#311D29; --line:#432A39;
  --ink:#F8E7EE; --muted:#C29CAD; --accent:#F06A9C; --accent-2:#E0477F; --accent-ink:#2A0E1B; --accent-soft:#40192B;
  --gold:#E5BA5E; --gold-2:#F3D78E; --gold-soft:#3A2B14;
  --good:#6FCB98; --bad:#F07A8C;
  --pm:#E5BA5E; --pm-soft:#3A2B14; --pc:#F27CA7; --pc-soft:#45192D; --pd:#D195C8; --pd-soft:#382036;
  --shadow:0 10px 24px -14px rgb(0 0 0 / .7); color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 100% 0%, var(--accent-soft) 0%, transparent 55%),radial-gradient(90% 50% at 0% 0%, var(--gold-soft) 0%, transparent 50%);
  background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* pilares */
.p-marcelo{--p:var(--pm);--ps:var(--pm-soft)}
.p-carla{--p:var(--pc);--ps:var(--pc-soft)}
.p-casal{--p:var(--pd);--ps:var(--pd-soft)}

/* topo */
header.top{padding-block:18px 8px;display:flex;flex-direction:column;gap:14px}
.hello{display:flex;align-items:center;gap:12px}
.logo{flex:none;width:52px;height:40px}
.logo svg{width:100%;height:100%}
.hello-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.hello-sub{font-size:14px;color:var(--muted);font-weight:600}
.hello h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em;color:var(--p,var(--ink))}
.hello .linkbtn{color:var(--muted)}
.filter{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 10px;font-size:13.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.filter button i,.pick button i,.legend i{width:10px;height:10px;border-radius:50%;background:var(--p,var(--muted));flex:none}
.filter button[aria-pressed="true"]{background:var(--ps);border-color:var(--p);color:var(--p)}
.filter button.all[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold-2),var(--gold));border-color:transparent;color:#3D2608}

/* menu inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgb(170 50 100 / .5);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button span.ic{display:grid;place-items:center;width:56px;height:32px;border-radius:999px;transition:background .2s}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"] span.ic{background:var(--accent-soft)}
@media (min-width:700px){nav.tabs{left:50%;right:auto;transform:translateX(-50%);width:min(640px,calc(100% - 32px));bottom:14px;border:1px solid var(--line);border-radius:24px;padding-bottom:8px}}

main{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:16px;padding:12px 16px;font-size:14px}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.block h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;text-wrap:balance}
.block h2 .tt{display:inline-flex;align-items:center;gap:10px}
.block h2 small{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib-pink{background:var(--accent-soft);color:var(--accent)}
.ib-gold{background:var(--gold-soft);color:var(--gold)}
.ib-plum{background:var(--pd-soft);color:var(--pd)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* dia e semana */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{font-family:var(--display);font-size:21px;margin:0;font-weight:600;text-align:center;flex:1;min-width:0}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-width:38px;height:38px;padding:0 13px;font-weight:800;color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week button{border:0;background:var(--sunk);border-radius:16px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-weight:700}
.week button b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:600}
.week button .wd{display:flex;gap:2px;height:5px}
.week button .wd i{width:5px;height:5px;border-radius:50%;background:var(--p)}
.week button[aria-pressed="true"]{background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.week button[aria-pressed="true"] b{color:var(--accent-ink)}
.week button[aria-pressed="true"] .wd i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.week button.today:not([aria-pressed="true"]){box-shadow:inset 0 0 0 2px var(--gold-2)}

/* progresso */
.ringrow{display:flex;align-items:center;gap:18px}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .track{stroke:var(--sunk)}
.ring .seg{stroke:var(--p);stroke-linecap:butt;transition:stroke-dasharray .4s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ringleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ringleg .legend{display:flex;align-items:center;gap:8px}
.ringleg .legend b{margin-left:auto;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.ring .seg,.bar span{transition:none}}

.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%;background:var(--p,linear-gradient(90deg,var(--gold-2),var(--gold)));transition:width .3s}
.bar.over span{background:var(--bad)}

/* formulários */
form.add{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
form.add > *{min-width:0}
input[type=text],input[type=date],input[type=email],input[type=password],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 13px;min-height:46px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;resize:vertical;min-height:84px}
.grow{flex:1 1 180px}
.btn{border:0;background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-radius:14px;padding:10px 20px;font-weight:800;min-height:46px;box-shadow:0 8px 16px -10px var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line);box-shadow:none}
.seg{display:inline-flex;background:var(--sunk);border-radius:14px;padding:4px;flex-wrap:wrap;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:11px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:7px;min-height:38px}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.pick button[aria-checked="true"]{background:var(--ps);color:var(--p);box-shadow:inset 0 0 0 1.5px var(--p)}
.fieldrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}

/* listas */
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:16px;background:var(--ps,var(--sunk));min-width:0;position:relative}
ul.list li::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--p,transparent)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp + .grp{margin-top:6px}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:5px}
.txt .tl{font-weight:700;line-height:1.3}
.txt .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted);font-weight:700}
.acts{flex:none;display:flex;align-items:center;gap:0}
.done .txt .tl{text-decoration:line-through;color:var(--muted);font-weight:600}
li.done{opacity:.75}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--p,var(--line));background:var(--surface);display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--p,var(--accent));border-color:var(--p,var(--accent))}
.chk[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:translateY(-1px) rotate(-45deg)}
.chip{flex:none;display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface);color:var(--p);white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--p)}
.del{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:6px 7px;border-radius:10px;min-width:32px;min-height:32px}
.del:hover{color:var(--accent)}
.del.armed{color:var(--surface);font-weight:800;background:var(--bad);font-size:13px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:800;padding:4px 0;font-size:14px}
.empty{color:var(--muted);font-size:15px;padding:10px 14px;margin:0;background:var(--sunk);border-radius:16px}
ul.list li.editing{display:block;padding:12px 12px 14px 16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--p)}
.note.editing{padding:14px 14px 14px 18px}
.editor{width:100%}
.editor textarea{min-height:100px}

.dots{display:flex;gap:4px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface);border:1.5px solid var(--p)}
.dots i.on{background:var(--p)}
.streak{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}

/* finanças */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0;border-radius:16px;padding:12px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;font-family:var(--display);font-weight:600}
.stat.in{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.stat.out{background:var(--accent-soft)}
.stat.bal{background:var(--gold-soft)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.amt{flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.date{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;width:40px;font-weight:700}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-weight:600}
.catrow .bar{grid-column:1 / -1;height:8px}
.limitline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.people3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{border-radius:16px;background:var(--ps);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:inset 0 0 0 1.5px transparent}
.pcard:hover{box-shadow:inset 0 0 0 1.5px var(--p)}
.pcard .label{color:var(--p)}
.pcard b{font-variant-numeric:tabular-nums;font-size:17px;overflow-wrap:anywhere;font-family:var(--display);font-weight:600}
.pcard small{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}

/* notas */
.note{border-radius:18px;background:var(--ps);padding:14px 14px 12px 18px;display:flex;flex-direction:column;gap:8px;position:relative}
.note::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--p)}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.note.pinned{box-shadow:inset 0 0 0 2px var(--gold-2)}
.note.pinned p{font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);z-index:20;box-shadow:var(--shadow)}

/* login */
.login{max-width:400px;margin:10vh auto 0;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.login .logo{width:104px;height:80px}
.login h1{font-family:var(--display);font-weight:600;font-size:34px;margin:0;letter-spacing:-.01em;
  background:linear-gradient(120deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.login form{display:flex;flex-direction:column;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.login input{width:100%}
.login .legend3{display:flex;gap:14px;font-size:14px;color:var(--muted);font-weight:700;flex-wrap:wrap;justify-content:center}
.login .legend3 span{display:inline-flex;align-items:center;gap:6px}
.login .legend3 i{width:10px;height:10px;border-radius:50%;background:var(--p)}
.login .err{color:var(--bad);font-size:14px;margin:0;font-weight:700}

@media (max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:1 / -1}
  .people3{grid-template-columns:1fr}
  .hello h1{font-size:25px}
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <span class="logo"><svg viewBox="0 0 52 40" aria-hidden="true"><defs><clipPath id="clip-login"><circle cx="19" cy="20" r="15"/></clipPath></defs><circle cx="19" cy="20" r="15" style="fill:var(--pm)"/><circle cx="33" cy="20" r="15" style="fill:var(--pc)"/><circle cx="33" cy="20" r="15" clip-path="url(#clip-login)" style="fill:var(--pd)"/></svg></span>
  <h1>Rotina a Dois</h1>
  <p class="muted" style="margin:0;font-weight:600">Rotina, hábitos, finanças, compras e notas da casa, sempre separados entre:</p>
  <div class="legend3"><span class="p-marcelo"><i></i>Marcelo</span><span class="p-carla"><i></i>Carla</span><span class="p-casal"><i></i>Nós dois</span></div>
  <form id="login-form">
    <input type="email" id="login-email" placeholder="Seu e-mail" autocomplete="username" required aria-label="E-mail">
    <input type="password" id="login-pass" placeholder="Senha" autocomplete="current-password" required aria-label="Senha">
    <button class="btn" type="submit" id="login-btn">Entrar</button>
    <p class="err" id="login-err" hidden></p>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="hello">
      <span class="logo"><svg viewBox="0 0 52 40" aria-hidden="true"><defs><clipPath id="clip-top"><circle cx="19" cy="20" r="15"/></clipPath></defs><circle cx="19" cy="20" r="15" style="fill:var(--pm)"/><circle cx="33" cy="20" r="15" style="fill:var(--pc)"/><circle cx="33" cy="20" r="15" clip-path="url(#clip-top)" style="fill:var(--pd)"/></svg></span>
      <div class="hello-txt"><span class="hello-sub" id="hello-sub">Olá,</span><h1 id="hello-name">Rotina a Dois</h1></div>
      <button class="linkbtn" type="button" id="logout">Sair</button>
    </div>
    <div class="filter" id="filter" role="group" aria-label="Mostrar itens de"></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Seções">
    <button role="tab" data-tab="hoje" aria-selected="true"><span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Hoje</button>
    <button role="tab" data-tab="financas" aria-selected="false"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1"/><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="16.5" cy="13.5" r="1.3"/></svg></span>Finanças</button>
    <button role="tab" data-tab="compras" aria-selected="false"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M3 10h18l-2 9a2 2 0 0 1-2 1.6H7A2 2 0 0 1 5 19z"/><path d="M8 10l4-6 4 6"/></svg></span>Compras</button>
    <button role="tab" data-tab="notas" aria-selected="false"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 11h8M8 15h6"/></svg></span>Notas</button>

<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import { FIREBASE_CONFIG, PESSOAS } from './config.js';

/* ---------- utilidades ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s, n) => { const d = parse(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); };
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return iso(d); };
const ym = s => s.slice(0, 7);
const brl = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = s => parse(s).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = s => { const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fmtMonth = s => cap(parse(s + '-01').toLocaleDateString('pt-BR', {month:'long', year:'numeric'}));
const WD = ['seg','ter','qua','qui','sex','sáb','dom'];
const PERIODS = [['manha','Manhã'],['tarde','Tarde'],['noite','Noite'],['livre','Qualquer hora']];
const CAT_OUT = ['Mercado','Contas fixas','Casa','Transporte','Comer fora','Lazer','Saúde','Compras pessoais','Outros'];

const toNum = v => { const n = parseFloat(String(v).replace(/\./g,'').replace(',', '.')); return isFinite(n) ? n : NaN; };

/* ---------- os três pilares ---------- */

const ICONS = {

  list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  basket: '<path d="M3 10h18l-2 9a2 2 0 0 1-2 1.6H7A2 2 0 0 1 5 19z"/><path d="M8 10l4-6 4 6"/>',

const ico = name => svgEl(`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`);
// título de seção: bolinha colorida com ícone + texto (+ detalhe à direita)
const main = (title, ...meta) => h('span', {class: 'txt'}, h('span', {class: 'tl', text: title}), meta.flat().some(Boolean) ? h('span', {class: 'meta'}, meta) : null);
const acts = (...b) => h('span', {class: 'acts'}, b);
{ const rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function(...k){ return rc.apply(this, k.flat().filter(x => x != null && x !== false)); }; }
const tk = (icon, tone, text, small) => [h('span', {class: 'tt'}, h('span', {class: 'ib ib-' + tone}, ico(icon)), h('span', {text})), small ? h('small', {text: small}) : null];
function chip(p){ return h('span', {class: 'chip p-' + p, text: PNAME[p]}); }
function pillarPicker(label){
  let val = null, touched = false;
  const box = h('div', {class: 'seg pick', role: 'radiogroup', 'aria-label': label});
  const draw = () => box.replaceChildren(...PILLARS.map(([v, l]) => h('button', {type: 'button', role: 'radio', class: 'p-' + v, 'aria-checked': String(v === box.get()),
    onclick: () => { val = v; touched = true; draw(); }}, h('i'), l)));
  box.get = () => val || (filterP !== 'todos' ? filterP : viewer);
  box.sync = () => { if (!touched) val = null; draw(); };
  box.reset = () => { touched = false; val = null; draw(); };
  box.set = v => { val = v; touched = true; draw(); };
  draw();
  return box;
}
function renderFilter(){
  const box = document.getElementById('filter');
  box.replaceChildren(
    h('button', {type: 'button', class: 'all', 'aria-pressed': String(filterP === 'todos'), onclick: () => setFilter('todos')}, 'Todos'),
    ...PILLARS.map(([v, l]) => h('button', {type: 'button', class: 'p-' + v, 'aria-pressed': String(filterP === v), onclick: () => setFilter(v)}, h('i'), l)));
  const hr = new Date().getHours();
  document.getElementById('hello-sub').textContent = (hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite') + ',';
  const hn = document.getElementById('hello-name');
  hn.textContent = mode === 'live' ? PNAME[viewer] : 'Rotina a Dois'; hn.className = mode === 'live' ? 'p-' + viewer : '';
}
function setFilter(v){ filterP = v; armed = null; try { localStorage.setItem('rad-filter', v); } catch {} refresh(); }

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* exclusão em dois toques */
let armed = null, armedT;
function arm(key){ armed = key; clearTimeout(armedT); armedT = setTimeout(() => { armed = null; refresh(); }, 3000); refresh(); }
function delBtn(key, onConfirm){
  const on = armed === key;
  return h('button', {class: 'del' + (on ? ' armed' : ''), type: 'button', 'aria-label': on ? 'Confirmar exclusão' : 'Excluir',
    onclick: () => { if (armed === key){ armed = null; onConfirm(); } else arm(key); }}, on ? 'Confirmar?' : '✕');

const emptyMsg = (all, some) => h('p', {class: 'empty'}, filterP === 'todos' ? all : `${some} de ${PNAME[filterP]}.`);

/* ---------- dados (Firebase Firestore) ---------- */
const COLS = ['tasks','habits','transactions','shopping','notes','settings'];
const data = {}; COLS.forEach(c => data[c] = []);
let mode = 'loading', readOnly = false;

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const fs = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});

function onWriteError(e){
  console.error(e);
  if (e && e.code === 'permission-denied') toast('Sem permissão para salvar. Confira se seu e-mail está liberado nas regras do Firestore.');
  else if (e && e.code === 'resource-exhausted') toast('O limite gratuito do Firebase foi atingido hoje. Tente amanhã.');
  else toast('Não consegui salvar agora. Tente de novo em instantes.');
}
// As gravações aparecem na tela na hora (cache local) e vão para o servidor em seguida, mesmo sem internet no momento.
const fire = p => { p.catch(onWriteError); return Promise.resolve(); };
function fieldPairs(obj, pre = [], out = []){
  for (const [k, v] of Object.entries(obj)){
    const path = [...pre, k];
    if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length) fieldPairs(v, path, out);
    else out.push(new FieldPath(...path), v);
  }
  return out;
}
const store = {
  add: (col, obj) => fire(addDoc(collection(fs, col), obj)),
  update: (col, id, patch) => fire(updateDoc(doc(fs, col, id), ...fieldPairs(patch))),
  set: (col, id, obj) => fire(setDoc(doc(fs, col, id), obj)),
  remove: (col, id) => fire(deleteDoc(doc(fs, col, id))),
};
const stamp = () => ({by: viewer, createdAt: Date.now()});

/* ---------- edição: qualquer um dos dois edita qualquer item ---------- */
let editing = null;
function startEdit(col, x){
  armed = null; editing = {col, id: x.id, el: buildEditor(col, x)}; refresh();
  setTimeout(() => { const f = editing && editing.el.querySelector('input[type=text],textarea'); if (f){ f.focus(); const n = f.value.length; try { f.setSelectionRange(n, n); } catch {} } }, 60);
}
function stopEdit(){ editing = null; refresh(); }
function editRow(col, x, tag = 'li'){
  if (!editing || editing.col !== col || editing.id !== x.id) return null;
  return h(tag, {class: (tag === 'li' ? 'editing' : 'note editing') + ' p-' + pOf(x)}, editing.el);
}
function editBtn(col, x){ return h('button', {class: 'del', type: 'button', 'aria-label': 'Editar', title: 'Editar', onclick: () => startEdit(col, x)}, '✎'); }
function buildEditor(col, x){
  const f = {};
  const text = (key, val, label, extra = {}) => (f[key] = h('input', {type: 'text', id: 'edit-' + key, value: val ?? '', placeholder: label, 'aria-label': label, ...extra}));
  const who = pillarPicker('De quem é'); who.set(pOf(x));
  let fields = [], collect;
  if (col === 'tasks'){
    f.date = h('input', {type: 'date', id: 'edit-date', value: x.date, 'aria-label': 'Data'});
    f.period = h('select', {id: 'edit-period', 'aria-label': 'Período'}, PERIODS.map(([v, t]) => h('option', {value: v}, t))); f.period.value = x.period || 'livre';
    fields = [text('title', x.title, 'Tarefa', {class: 'grow', maxlength: 140}), f.period, f.date];
    collect = () => { const title = f.title.value.trim(); if (!title){ toast('Escreva a tarefa.'); return null; } return {title, period: f.period.value, date: f.date.value || x.date}; };
  } else if (col === 'habits'){
    fields = [text('name', x.name, 'Hábito', {class: 'grow', maxlength: 80})];
    collect = () => { const name = f.name.value.trim(); if (!name){ toast('Escreva o nome do hábito.'); return null; } return {name}; };
  } else if (col === 'transactions'){
    f.cat = h('select', {id: 'edit-cat', 'aria-label': 'Categoria'}, (x.type === 'entrada' ? CAT_IN : CAT_OUT).map(c => h('option', {value: c}, c))); f.cat.value = x.category;
    f.date = h('input', {type: 'date', id: 'edit-date', value: x.date, 'aria-label': 'Data'});
    fields = [text('desc', x.desc, 'Descrição', {class: 'grow', maxlength: 100}), text('amount', String(x.amount).replace('.', ','), 'Valor R$', {inputmode: 'decimal', style: 'width:120px'}), f.cat, f.date,
      x.installment ? h('p', {class: 'muted', style: 'margin:0;font-size:13px;width:100%'}, `Altera só esta parcela (${x.installment.n}/${x.installment.total}).`) : null];
    collect = () => { const desc = f.desc.value.trim(), v = toNum(f.amount.value);
      if (!desc){ toast('Escreva uma descrição.'); return null; }
      if (!isFinite(v) || v <= 0){ toast('Informe um valor maior que zero, ex.: 45,90.'); return null; }
      return {desc, amount: Math.round(v * 100) / 100, category: f.cat.value, date: f.date.value || x.date}; };
  } else if (col === 'shopping'){
    fields = [text('item', x.item, 'Item', {class: 'grow', maxlength: 80}), text('qty', x.qty, 'Qtd.', {style: 'width:80px', maxlength: 20})];
    collect = () => { const item = f.item.value.trim(); if (!item){ toast('Escreva o item.'); return null; } return {item, qty: f.qty.value.trim()}; };
  } else if (col === 'notes'){
    f.text = h('textarea', {id: 'edit-text', 'aria-label': 'Nota', maxlength: 4000}); f.text.value = x.text || '';
    fields = [f.text];
    collect = () => { const t = f.text.value.trim(); if (!t){ toast('A nota está vazia.'); return null; } return {text: t}; };
  }
  return h('form', {class: 'add editor', onsubmit: e => { e.preventDefault();
      const patch = collect(); if (!patch) return;
      store.update(col, x.id, {...patch, who: who.get(), editedBy: viewer, editedAt: Date.now()});
      stopEdit(); toast('Alterações salvas.'); }},
    ...fields,
    h('div', {class: 'fieldrow'}, h('span', {class: 'label'}, 'De'), who,
      h('div', {style: 'margin-left:auto;display:flex;gap:8px'},
        h('button', {class: 'btn ghost', type: 'button', onclick: stopEdit}, 'Cancelar'),
        h('button', {class: 'btn', type: 'submit'}, 'Salvar'))));
}

/* ---------- aba: Hoje ---------- */
let day = today();
const Hoje = {
  mount(root){
    this.nav = h('div', {class: 'daynav'});
    this.week = h('div', {class: 'week'});
    this.prog = h('div', {class: 'ringrow'});
    const top = h('section', {class: 'block'}, this.nav, this.week, this.prog);

    this.taskTitle = h('input', {type: 'text', id: 'task-title', class: 'grow', placeholder: 'Nova tarefa', 'aria-label': 'Nova tarefa', maxlength: 140});
    this.taskPeriod = h('select', {id: 'task-period', 'aria-label': 'Período'}, PERIODS.map(([v, t]) => h('option', {value: v}, t)));
    this.taskWho = pillarPicker('Para quem é a tarefa');
    const form = h('form', {class: 'add', onsubmit: e => { e.preventDefault();
      const title = this.taskTitle.value.trim(); if (!title) return;
      store.add('tasks', {title, date: day, period: this.taskPeriod.value, who: this.taskWho.get(), done: false, ...stamp()});
      this.taskTitle.value = ''; this.taskTitle.focus(); }},
      this.taskTitle, this.taskPeriod, h('div', {class: 'fieldrow'}, h('span', {class: 'label'}, 'Para'), this.taskWho, h('button', {class: 'btn', type: 'submit', style: 'margin-left:auto'}, 'Adicionar')));
    this.taskList = h('div');
    this.carry = h('div');
    this.taskTitleH = h('h2');
    const tasks = h('section', {class: 'block'}, this.taskTitleH, form, this.carry, this.taskList);

    this.habName = h('input', {type: 'text', id: 'habit-name', class: 'grow', placeholder: 'Novo hábito (ex.: beber 2L de água)', 'aria-label': 'Novo hábito', maxlength: 80});
    this.habWho = pillarPicker('De quem é o hábito');
    const hform = h('form', {class: 'add', onsubmit: e => { e.preventDefault();
      const name = this.habName.value.trim(); if (!name) return;
      store.add('habits', {name, who: this.habWho.get(), days: {}, ...stamp()});
      this.habName.value = ''; }},
      this.habName, h('div', {class: 'fieldrow'}, h('span', {class: 'label'}, 'De'), this.habWho, h('button', {class: 'btn', type: 'submit', style: 'margin-left:auto'}, 'Criar')));
    this.habList = h('div');
    const habits = h('section', {class: 'block'}, h('h2', {}, ...tk('heart', 'plum', 'Hábitos', 'toque no círculo para marcar')), this.habList, hform);

    root.append(top, tasks, habits);
  },
  update(){
    const t = today();
    this.taskWho.sync(); this.habWho.sync();
    this.nav.replaceChildren(
      h('button', {class: 'iconbtn', type: 'button', 'aria-label': 'Dia anterior', onclick: () => { day = addDays(day, -1); refresh(); }}, '‹'),
      h('h2', {text: day === t ? `Hoje, ${fmtLong(day).split(', ')[1]}` : cap(fmtLong(day))}),
      h('div', {style: 'display:flex;gap:6px'},
        day !== t ? h('button', {class: 'iconbtn', type: 'button', onclick: () => { day = t; refresh(); }}, 'Hoje') : null,
        h('button', {class: 'iconbtn', type: 'button', 'aria-label': 'Próximo dia', onclick: () => { day = addDays(day, 1); refresh(); }}, '›')));

    const ws = weekStart(day);
    const allTasks = data.tasks.filter(pass);
    this.week.replaceChildren(...WD.map((w, i) => { const d = addDays(ws, i);
      const ps = new Set(allTasks.filter(x => x.date === d).map(pOf));
      return h('button', {type: 'button', 'aria-pressed': String(d === day), class: d === t ? 'today' : null, 'aria-label': fmtLong(d), onclick: () => { day = d; refresh(); }},
        h('span', {style: 'font-size:12px'}, w), h('b', {}, parse(d).getDate()),
        h('span', {class: 'wd'}, PILLARS.filter(([p]) => ps.has(p)).map(([p]) => h('i', {class: 'p-' + p})))); }));

    const dayTasks = allTasks.filter(x => x.date === day);
    const habs = data.habits.filter(pass).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    // progresso por pilar
    const prog = PILLARS.map(([p, l]) => {
      const tt = dayTasks.filter(x => pOf(x) === p), hh = habs.filter(x => pOf(x) === p);
      return {p, l, total: tt.length + hh.length, done: tt.filter(x => x.done).length + hh.filter(x => x.days && x.days[day]).length};
    }).filter(x => x.total);
    const total = prog.reduce((s, x) => s + x.total, 0), done = prog.reduce((s, x) => s + x.done, 0);
    const R = 40, C = 2 * Math.PI * R; let off = 0;
    const segs = prog.map(x => { const len = total ? x.done / total * C : 0; const seg = `<circle class="seg p-${x.p}" cx="48" cy="48" r="${R}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return seg; }).join('');
    const pct = total ? Math.round(done / total * 100) : 0;
    this.prog.replaceChildren(
      h('div', {class: 'ring', role: 'img', 'aria-label': total ? `${pct}% do dia concluído. ` + prog.map(x => `${x.l}: ${x.done} de ${x.total}`).join(', ') : 'Nada planejado'},
        svgEl(`<svg viewBox="0 0 96 96"><circle class="track" cx="48" cy="48" r="${R}"/>${segs}</svg>`), h('b', {}, `${pct}%`)),
      h('div', {class: 'ringleg'},
        h('span', {class: 'label'}, 'Progresso do dia'),
        prog.length ? prog.map(x => h('span', {class: 'legend p-' + x.p}, h('i'), x.l, h('b', {}, `${x.done}/${x.total}`)))
          : h('span', {class: 'muted', style: 'font-weight:600'}, 'Nada planejado ainda. Adicione tarefas ou hábitos abaixo.')));

    this.taskTitleH.replaceChildren(...tk('check', 'pink', 'Tarefas', dayTasks.length ? `${dayTasks.filter(x => !x.done).length} por fazer` : ''));

      h('span', {}, `${late.length} ${late.length === 1 ? 'tarefa ficou pendente' : 'tarefas ficaram pendentes'} nos últimos dias.`),
      h('button', {class: 'linkbtn', type: 'button', onclick: async () => { for (const x of late) await store.update('tasks', x.id, {date: t}); toast('Pendências trazidas para hoje.'); }}, 'Trazer para hoje')) : '');

    if (!dayTasks.length){
      this.taskList.replaceChildren(day === t ? emptyMsg('Nenhuma tarefa para hoje. Escreva acima e escolha se é do Marcelo, da Carla ou dos dois.', 'Nenhuma tarefa hoje') : emptyMsg('Nenhuma tarefa neste dia.', 'Nenhuma tarefa neste dia'));
    } else {
      this.taskList.replaceChildren(...PERIODS.map(([p, label]) => {
        const items = dayTasks.filter(x => (x.period || 'livre') === p).sort((a, b) => (a.done - b.done) || (a.createdAt || 0) - (b.createdAt || 0));
        if (!items.length) return null;
        return h('div', {class: 'grp'}, h('span', {class: 'label'}, label), h('ul', {class: 'list'}, items.map(x =>
          editRow('tasks', x) || h('li', {class: `p-${pOf(x)}${x.done ? ' done' : ''}`},
            h('button', {class: 'chk', type: 'button', 'aria-pressed': String(!!x.done), 'aria-label': x.done ? 'Desmarcar' : 'Marcar como feita', onclick: () => store.update('tasks', x.id, {done: !x.done})}),
            main(x.title, chip(pOf(x))),
            acts(editBtn('tasks', x), delBtn('t' + x.id, () => store.remove('tasks', x.id)))))));
      }));
    }

    const ws7 = WD.map((_, i) => addDays(ws, i));
    if (!habs.length){
      this.habList.replaceChildren(emptyMsg('Crie hábitos para cada um acompanhar, como água, treino ou leitura. Os pontinhos mostram a semana.', 'Nenhum hábito'));
    } else {
      this.habList.replaceChildren(...PILLARS.map(([p, l]) => {

  const sub = (col, ...cons) => unsubs.push(onSnapshot(query(collection(fs, col), ...cons),
    s => { data[col] = s.docs.map(d => ({id: d.id, ...d.data()})); refresh(); },
    e => { console.error(e); toast(e.code === 'permission-denied' ? 'Sem permissão para ler os dados. Confira as regras do Firestore.' : 'Não consegui carregar os dados.'); }));
  sub('tasks', orderBy('date', 'desc'), limit(1000));
  sub('habits', limit(200));
  sub('transactions', orderBy('date', 'desc'), limit(1000));
  sub('shopping', limit(500));
  sub('notes', orderBy('createdAt', 'desc'), limit(300));
  sub('settings', limit(10));
  mountTab();
});
</script>
</body>
